name: Release Loader

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-loader:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Build loader
        shell: pwsh
        run: ./loader/build-chocola.ps1

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: loader/dist/Vanille.exe
          generate_release_notes: true
